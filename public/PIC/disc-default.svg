<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="d-body" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="55%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <linearGradient id="d-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7676"/>
      <stop offset="100%" stop-color="#d83c3c"/>
    </linearGradient>
  </defs>

  <!-- 盘体 -->
  <circle cx="100" cy="100" r="99" fill="url(#d-body)"/>
  <circle cx="100" cy="100" r="99" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- 音轨同心纹 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <circle cx="100" cy="100" r="92"/>
    <circle cx="100" cy="100" r="86"/>
    <circle cx="100" cy="100" r="80"/>
    <circle cx="100" cy="100" r="74"/>
    <circle cx="100" cy="100" r="68"/>
    <circle cx="100" cy="100" r="62"/>
    <circle cx="100" cy="100" r="56"/>
    <circle cx="100" cy="100" r="50"/>
  </g>

  <!-- 反光弧（不对称，用于看出旋转） -->
  <path d="M100 100 L 12 62 A 99 99 0 0 1 100 1 Z" fill="url(#d-sheen)"/>
  <path d="M100 100 L 188 138 A 99 99 0 0 1 100 199 Z" fill="#ffffff" fill-opacity="0.05"/>

  <!-- 中心标签 -->
  <circle cx="100" cy="100" r="36" fill="url(#d-label)"/>
  <circle cx="100" cy="100" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <!-- 标签上的音符（也是旋转参照） -->
  <path d="M108 82v26a8 8 0 1 1-4-6.9V88l-16 4v22a8 8 0 1 1-4-6.9V84z"
        fill="#ffffff" fill-opacity="0.9"/>
  <!-- 中心孔 -->
  <circle cx="100" cy="100" r="7" fill="#121212"/>
  <circle cx="100" cy="100" r="7" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
</svg>
